<!DOCTYPE html>
<html>
<head>

<title>Heart Disease AI Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* Background */

body{
background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
font-family: Arial, sans-serif;
color:white;
}

/* Heart animation */

.heart{
font-size:40px;
animation: beat 1s infinite;
text-align:center;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}

/* Card */

.card-box{
background:white;
color:black;
border-radius:15px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* Input */

.form-control{
border-radius:10px;
margin-bottom:10px;
}

/* Button */

button{
width:100%;
border-radius:10px;
font-size:18px;
}

/* Result */

.result{
font-size:22px;
font-weight:bold;
color:#dc3545;
text-align:center;
}

/* Risk text */

.risk{
font-size:20px;
color:#198754;
text-align:center;
margin-top:10px;
}

/* Progress bar */

.progress{
height:25px;
margin-top:15px;
}

/* Responsive */

@media(max-width:768px){

h1{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="container py-5">

<h1 class="text-center mb-4">AI Heart Disease Prediction</h1>

<div class="heart">❤️</div>

<div class="row mt-4">

<!-- Form -->

<div class="col-lg-6 col-md-12 mb-4">

<div class="card-box">

<h4 class="mb-3">Enter Patient Data</h4>

<form action="/predict" method="post">

<input type="number" name="age" class="form-control" placeholder="Age" required>

<input type="number" name="sex" class="form-control" placeholder="Sex (1=Male 0=Female)" required>

<input type="number" name="cp" class="form-control" placeholder="Chest Pain Type" required>

<input type="number" name="trestbps" class="form-control" placeholder="Resting Blood Pressure" required>

<input type="number" name="chol" class="form-control" placeholder="Cholesterol" required>

<input type="number" name="fbs" class="form-control" placeholder="Fasting Blood Sugar" required>

<input type="number" name="restecg" class="form-control" placeholder="Rest ECG" required>

<input type="number" name="thalach" class="form-control" placeholder="Max Heart Rate" required>

<input type="number" name="exang" class="form-control" placeholder="Exercise Angina" required>

<input type="number" name="oldpeak" class="form-control" placeholder="Oldpeak" required>

<input type="number" name="slope" class="form-control" placeholder="Slope" required>

<input type="number" name="ca" class="form-control" placeholder="Major Vessels" required>

<input type="number" name="thal" class="form-control" placeholder="Thal" required>

<button class="btn btn-primary mt-2">Predict</button>

</form>

</div>

</div>

<!-- Result -->

<div class="col-lg-6 col-md-12">

<div class="card-box">

<h4>Prediction Result</h4>

<div class="result">
{{ prediction_text }}
</div>

<div class="risk">
{{ risk_percentage }}
</div>

<!-- Risk Meter -->

<div class="progress">
    <div class="progress-bar bg-danger"
         role="progressbar"
         style="width: {{ risk_percentage.split(': ')[1].replace('%','') if risk_percentage else 0 }}%">
    </div>
</div>

</div>

</div>

</div>

</div>

</body>
</html>
